name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: Verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Install Linux desktop headers
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld libgl1-mesa-dev libegl1-mesa-dev libgles2-mesa-dev libwayland-dev libxkbcommon-dev libxkbcommon-x11-dev xorg-dev xvfb language-pack-en
          echo "CC=clang" >> "$GITHUB_ENV"
          echo "CGO_LDFLAGS=-fuse-ld=lld" >> "$GITHUB_ENV"
          echo "LANG=en_US.UTF-8" >> "$GITHUB_ENV"

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Check formatting
        shell: bash
        run: |
          files="$(gofmt -l .)"
          if [ -n "$files" ]; then
            echo "gofmt would change:"
            echo "$files"
            exit 1
          fi

      - name: Verify generated icon assets
        shell: bash
        run: |
          go run ./tools/iconassets
          git diff --exit-code -- assets/icon-256.png

      - name: Run vet
        run: go vet ./...

      - name: Run unit tests
        run: go test ./...

      - name: Run vulnerability scan
        if: runner.os == 'Linux'
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.7.0 ./...

      - name: Prepare Windows icon resource
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          go install github.com/tc-hib/go-winres@v0.3.3
          $goBin = go env GOBIN
          if ([string]::IsNullOrWhiteSpace($goBin)) {
            $goBin = Join-Path (go env GOPATH) "bin"
          }
          $env:Path = "$goBin;$env:Path"
          $resourcePrefix = "cmd\netquota\netquota"
          go-winres simply `
            --arch amd64 `
            --out $resourcePrefix `
            --icon assets\windows\icon.ico `
            --manifest gui `
            --file-version 0.0.0.0 `
            --product-version 0.0.0.0 `
            --file-description "NetQuota" `
            --product-name "NetQuota" `
            --original-filename "netquota.exe"
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

      - name: Build application
        run: go build -trimpath ./cmd/netquota

      - name: Compile localized Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $staging = "release-ci\netquota-windows-amd64"
          New-Item -ItemType Directory -Force $staging | Out-Null
          go build -trimpath -tags migrated_fynedo -ldflags "-H=windowsgui" -o "$staging\netquota.exe" .\cmd\netquota
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }
          go build -trimpath -tags migrated_fynedo -o "$staging\netquota-console.exe" .\cmd\netquota
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }
          Copy-Item README.md, LICENSE, PRIVACY.md, assets\windows\icon.ico $staging
          Copy-Item LICENSE "$staging\LICENSE.txt"
          Copy-Item assets\fonts\OFL.txt "$staging\NotoSansCJK-OFL.txt"
          $sourceDir = (Resolve-Path $staging).Path
          $iscc = (Get-Command iscc.exe -ErrorAction Stop).Source
          & $iscc "/DAppVersion=0.0.0" "/DAppBinaryVersion=0.0.0" "/DSourceDir=$sourceDir" "/Orelease-ci" .\packaging\windows\netquota.iss
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }
          if (-not (Test-Path -LiteralPath "release-ci\netquota-windows-amd64-setup.exe")) {
            throw "Inno Setup did not produce the localized installer."
          }

      - name: Clean Windows icon resource
        if: always() && runner.os == 'Windows'
        shell: pwsh
        run: |
          Remove-Item -LiteralPath "cmd\netquota\netquota_windows_amd64.syso" -Force -ErrorAction SilentlyContinue
