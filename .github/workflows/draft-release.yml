name: Draft release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to create or update
        required: true
        default: v0.1.0
        type: string

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows release
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v5
        with:
          ref: ${{ github.ref }}

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Check formatting
        shell: pwsh
        run: |
          $files = gofmt -l .
          if ($files) {
            Write-Host "gofmt would change:"
            $files
            exit 1
          }

      - name: Run vet
        run: go vet ./...

      - name: Run unit tests
        run: go test ./...

      - name: Build Windows package
        shell: pwsh
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          if ($env:RELEASE_TAG -notmatch '^v[0-9]+\.[0-9]+\.[0-9]+$') {
            Write-Error "tag must use the form vX.Y.Z"
            exit 1
          }
          $releaseVersion = $env:RELEASE_TAG.Substring(1)
          $versionLdflag = "-X=github.com/KageRyo/netquota/internal/version.Value=$releaseVersion"
          $staging = "release\netquota-windows-amd64"
          New-Item -ItemType Directory -Force $staging | Out-Null
          $guiLdflags = "-H=windowsgui -s -w $versionLdflag"
          $consoleLdflags = "-s -w $versionLdflag"
          go build -trimpath -tags migrated_fynedo -ldflags $guiLdflags -o "$staging\netquota.exe" .\cmd\netquota
          go build -trimpath -tags migrated_fynedo -ldflags $consoleLdflags -o "$staging\netquota-console.exe" .\cmd\netquota
          Copy-Item README.md, LICENSE $staging
          Compress-Archive -Path "$staging\*" -DestinationPath "netquota-windows-amd64.zip" -Force
          $sourceDir = (Resolve-Path $staging).Path
          $iscc = (Get-Command iscc.exe -ErrorAction Stop).Source
          & $iscc "/DAppVersion=$releaseVersion" "/DSourceDir=$sourceDir" "/Orelease" .\packaging\windows\netquota.iss
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v6
        with:
          name: netquota-windows-amd64
          path: netquota-windows-amd64.zip
          if-no-files-found: error

      - name: Upload installer artifact
        uses: actions/upload-artifact@v6
        with:
          name: netquota-windows-amd64-installer
          path: release/netquota-windows-amd64-setup.exe
          if-no-files-found: error

  create-draft-release:
    name: Create draft release
    needs: build-windows
    runs-on: ubuntu-latest
    steps:
      - name: Download Windows package
        uses: actions/download-artifact@v7
        with:
          name: netquota-windows-amd64
          path: dist

      - name: Download Windows installer
        uses: actions/download-artifact@v7
        with:
          name: netquota-windows-amd64-installer
          path: dist

      - name: Create or update draft release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.tag }}
          RELEASE_TARGET: ${{ github.sha }}
        run: |
          set -euo pipefail

          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "tag must use the form vX.Y.Z" >&2
            exit 1
          fi

          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            is_draft="$(gh release view "$RELEASE_TAG" --json isDraft --jq '.isDraft')"
            if [[ "$is_draft" != "true" ]]; then
              echo "refusing to modify a published release: $RELEASE_TAG" >&2
              exit 1
            fi
            gh release edit "$RELEASE_TAG" --draft --target "$RELEASE_TARGET"
            gh release upload "$RELEASE_TAG" \
              dist/netquota-windows-amd64.zip \
              dist/netquota-windows-amd64-setup.exe \
              --clobber
          else
            gh release create "$RELEASE_TAG" \
              dist/netquota-windows-amd64.zip \
              dist/netquota-windows-amd64-setup.exe \
              --draft \
              --target "$RELEASE_TARGET" \
              --title "NetQuota $RELEASE_TAG" \
              --generate-notes
          fi

          gh release view "$RELEASE_TAG" --json url,isDraft,tagName
