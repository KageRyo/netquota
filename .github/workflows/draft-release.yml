name: Draft release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to create or update
        required: true
        default: v0.1.0-alpha.3
        type: string

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows release
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v5
        with:
          ref: ${{ github.ref }}

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Check formatting
        shell: pwsh
        run: |
          $files = gofmt -l .
          if ($files) {
            Write-Host "gofmt would change:"
            $files
            exit 1
          }

      - name: Run vet
        run: go vet ./...

      - name: Run unit tests
        run: go test ./...

      - name: Verify generated icon assets
        shell: pwsh
        run: |
          go run .\tools\iconassets
          git diff --exit-code -- assets/icon-256.png assets/windows/icon.ico

      - name: Build Windows package
        shell: pwsh
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          WINDOWS_SIGNING_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_SIGNING_CERTIFICATE_BASE64 }}
          WINDOWS_SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_SIGNING_CERTIFICATE_PASSWORD }}
          WINDOWS_SIGNING_TIMESTAMP_URL: ${{ vars.WINDOWS_SIGNING_TIMESTAMP_URL }}
        run: |
          $semverPattern = '^v(?<core>(?:0|[1-9][0-9]*)\.(?:0|[1-9][0-9]*)\.(?:0|[1-9][0-9]*))(?<prerelease>-(?:[0-9A-Za-z-]+(?:\.[0-9A-Za-z-]+)*))?$'
          if ($env:RELEASE_TAG -match $semverPattern) {
            $releaseCoreVersion = $Matches.core
            $releasePrerelease = $Matches.prerelease
          } else {
            Write-Error "tag must use the SemVer form vX.Y.Z or vX.Y.Z-prerelease"
            exit 1
          }
          if ($releasePrerelease) {
            foreach ($identifier in $releasePrerelease.Substring(1).Split('.')) {
              if ($identifier -match '^[0-9]+$' -and $identifier.Length -gt 1 -and $identifier.StartsWith('0')) {
                Write-Error "numeric pre-release identifiers must not contain leading zeroes"
                exit 1
              }
            }
          }
          $releaseVersion = "$releaseCoreVersion$releasePrerelease"
          $versionLdflag = "-X=github.com/KageRyo/netquota/internal/version.Value=$releaseVersion"
          $staging = "release\netquota-windows-amd64"
          New-Item -ItemType Directory -Force $staging | Out-Null
          $guiLdflags = "-H=windowsgui -s -w $versionLdflag"
          $consoleLdflags = "-s -w $versionLdflag"

          go install github.com/tc-hib/go-winres@v0.3.3
          $goBin = go env GOBIN
          if ([string]::IsNullOrWhiteSpace($goBin)) {
            $goBin = Join-Path (go env GOPATH) "bin"
          }
          $env:Path = "$goBin;$env:Path"
          $resourcePrefix = "cmd\netquota\netquota"
          $resourceFile = "${resourcePrefix}_windows_amd64.syso"
          go-winres simply `
            --arch amd64 `
            --out $resourcePrefix `
            --icon assets\windows\icon.ico `
            --manifest gui `
            --file-version "${releaseCoreVersion}.0" `
            --product-version "${releaseCoreVersion}.0" `
            --file-description "NetQuota" `
            --product-name "NetQuota" `
            --original-filename "netquota.exe"
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }
          if (-not (Test-Path -LiteralPath $resourceFile)) {
            throw "go-winres did not produce $resourceFile"
          }

          go build -trimpath -tags migrated_fynedo -ldflags $guiLdflags -o "$staging\netquota.exe" .\cmd\netquota
          if ($LASTEXITCODE -ne 0) {
            Remove-Item -LiteralPath $resourceFile -Force -ErrorAction SilentlyContinue
            exit $LASTEXITCODE
          }
          Remove-Item -LiteralPath $resourceFile -Force
          go build -trimpath -tags migrated_fynedo -ldflags $consoleLdflags -o "$staging\netquota-console.exe" .\cmd\netquota

          $hasCertificate = -not [string]::IsNullOrWhiteSpace($env:WINDOWS_SIGNING_CERTIFICATE_BASE64)
          $hasPassword = -not [string]::IsNullOrWhiteSpace($env:WINDOWS_SIGNING_CERTIFICATE_PASSWORD)
          if ($hasCertificate -xor $hasPassword) {
            throw "Both WINDOWS_SIGNING_CERTIFICATE_BASE64 and WINDOWS_SIGNING_CERTIFICATE_PASSWORD are required for code signing."
          }

          $certificatePath = $null
          $signtoolPath = $null
          if ($hasCertificate) {
            $certificatePath = Join-Path $env:RUNNER_TEMP "netquota-signing.pfx"
            $certificateBase64 = $env:WINDOWS_SIGNING_CERTIFICATE_BASE64 -replace '\s', ''
            [System.IO.File]::WriteAllBytes(
              $certificatePath,
              [Convert]::FromBase64String($certificateBase64)
            )

            $signtoolCommand = Get-Command signtool.exe -ErrorAction SilentlyContinue
            if ($signtoolCommand) {
              $signtoolPath = $signtoolCommand.Source
            } else {
              $signtoolPath = Get-ChildItem `
                -Path "${env:ProgramFiles(x86)}\Windows Kits\10\bin" `
                -Filter signtool.exe `
                -Recurse `
                -File `
                -ErrorAction SilentlyContinue |
                Where-Object { $_.FullName -match '\\x64\\signtool\.exe$' } |
                Sort-Object FullName -Descending |
                Select-Object -First 1 -ExpandProperty FullName
            }
            if ([string]::IsNullOrWhiteSpace($signtoolPath)) {
              throw "signtool.exe was not found on the Windows runner."
            }

            $timestampUrl = $env:WINDOWS_SIGNING_TIMESTAMP_URL
            if ([string]::IsNullOrWhiteSpace($timestampUrl)) {
              $timestampUrl = "http://timestamp.digicert.com"
            }

            function Sign-Binary {
              param([string]$Path)

              & $signtoolPath sign `
                /fd SHA256 `
                /td SHA256 `
                /tr $timestampUrl `
                /f $certificatePath `
                /p $env:WINDOWS_SIGNING_CERTIFICATE_PASSWORD `
                $Path
              if ($LASTEXITCODE -ne 0) {
                throw "signtool failed to sign $Path."
              }
            }

            function Verify-Binary {
              param([string]$Path)

              & $signtoolPath verify /pa /all $Path
              if ($LASTEXITCODE -ne 0) {
                throw "signtool failed to verify $Path."
              }
            }

            $signedBinaries = @(
              "$staging\netquota.exe",
              "$staging\netquota-console.exe"
            )
            foreach ($binary in $signedBinaries) {
              Sign-Binary $binary
              Verify-Binary $binary
            }
            Write-Host "Windows binaries were Authenticode-signed."
          } else {
            Write-Host "No Windows signing certificate configured; building unsigned artifacts."
          }

          Copy-Item README.md, LICENSE, PRIVACY.md, assets\windows\icon.ico $staging
          Copy-Item LICENSE "$staging\LICENSE.txt"
          Copy-Item assets\fonts\OFL.txt "$staging\NotoSansCJK-OFL.txt"
          $sourceDir = (Resolve-Path $staging).Path
          $iscc = (Get-Command iscc.exe -ErrorAction Stop).Source
          & $iscc "/DAppVersion=$releaseVersion" "/DAppBinaryVersion=$releaseCoreVersion" "/DSourceDir=$sourceDir" "/Orelease" .\packaging\windows\netquota.iss
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

          if ($hasCertificate) {
            $installer = "release\netquota-windows-amd64-setup.exe"
            Sign-Binary $installer
            Verify-Binary $installer
            Write-Host "Windows installer was Authenticode-signed."
          }

          Remove-Item -LiteralPath "$staging\LICENSE.txt" -Force
          Compress-Archive -Path "$staging\*" -DestinationPath "netquota-windows-amd64.zip" -Force

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v6
        with:
          name: netquota-windows-amd64
          path: netquota-windows-amd64.zip
          if-no-files-found: error

      - name: Upload installer artifact
        uses: actions/upload-artifact@v6
        with:
          name: netquota-windows-amd64-installer
          path: release/netquota-windows-amd64-setup.exe
          if-no-files-found: error

  build-linux:
    name: Build Linux release
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v5
        with:
          ref: ${{ github.ref }}

      - name: Install Linux desktop headers
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld libgl1-mesa-dev libegl1-mesa-dev libgles2-mesa-dev libwayland-dev libxkbcommon-dev libxkbcommon-x11-dev xorg-dev xvfb language-pack-en
          echo "CC=clang" >> "$GITHUB_ENV"
          echo "CGO_LDFLAGS=-fuse-ld=lld" >> "$GITHUB_ENV"
          echo "LANG=en_US.UTF-8" >> "$GITHUB_ENV"

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Check formatting
        shell: bash
        run: |
          files="$(gofmt -l .)"
          if [[ -n "$files" ]]; then
            echo "gofmt would change:"
            echo "$files"
            exit 1
          fi

      - name: Run vet
        run: go vet ./...

      - name: Run unit tests
        run: go test ./...

      - name: Verify generated icon assets
        shell: bash
        run: |
          go run ./tools/iconassets
          git diff --exit-code -- assets/icon-256.png assets/windows/icon.ico

      - name: Build Linux package
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail

          semver_pattern='^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$'
          if [[ ! "$RELEASE_TAG" =~ $semver_pattern ]]; then
            echo "tag must use the SemVer form vX.Y.Z or vX.Y.Z-prerelease" >&2
            exit 1
          fi
          release_version="${RELEASE_TAG#v}"
          if [[ "$release_version" == *-* ]]; then
            prerelease="${release_version#*-}"
            IFS='.' read -r -a identifiers <<< "$prerelease"
            for identifier in "${identifiers[@]}"; do
              if [[ "$identifier" =~ ^[0-9]+$ && ${#identifier} -gt 1 && "${identifier:0:1}" == "0" ]]; then
                echo "numeric pre-release identifiers must not contain leading zeroes" >&2
                exit 1
              fi
            done
          fi

          version_ldflag="-X=github.com/KageRyo/netquota/internal/version.Value=$release_version"
          staging="release/netquota-linux-amd64"
          mkdir -p "$staging"
          go build -trimpath -ldflags "-s -w $version_ldflag" -o "$staging/netquota" ./cmd/netquota
          cp README.md LICENSE PRIVACY.md assets/icon-256.png "$staging/"
          cp assets/fonts/OFL.txt "$staging/NotoSansCJK-OFL.txt"
          tar -C release -czf netquota-linux-amd64.tar.gz netquota-linux-amd64

      - name: Upload Linux package
        uses: actions/upload-artifact@v6
        with:
          name: netquota-linux-amd64
          path: netquota-linux-amd64.tar.gz
          if-no-files-found: error

  create-draft-release:
    name: Create draft release
    needs: [build-windows, build-linux]
    runs-on: ubuntu-latest
    steps:
      - name: Download Windows package
        uses: actions/download-artifact@v7
        with:
          name: netquota-windows-amd64
          path: dist

      - name: Download Windows installer
        uses: actions/download-artifact@v7
        with:
          name: netquota-windows-amd64-installer
          path: dist

      - name: Download Linux package
        uses: actions/download-artifact@v7
        with:
          name: netquota-linux-amd64
          path: dist

      - name: Generate release checksums
        shell: bash
        run: |
          set -euo pipefail
          (
            cd dist
            sha256sum \
              netquota-windows-amd64.zip \
              netquota-windows-amd64-setup.exe \
              netquota-linux-amd64.tar.gz \
              > SHA256SUMS
          )

      - name: Create or update draft release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.tag }}
          RELEASE_TARGET: ${{ github.sha }}
        run: |
          set -euo pipefail

          if [[ ! "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$ ]]; then
            echo "tag must use the SemVer form vX.Y.Z or vX.Y.Z-prerelease" >&2
            exit 1
          fi

          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            is_draft="$(gh release view "$RELEASE_TAG" --json isDraft --jq '.isDraft')"
            if [[ "$is_draft" != "true" ]]; then
              echo "refusing to modify a published release: $RELEASE_TAG" >&2
              exit 1
            fi
            release_edit_args=(--draft --target "$RELEASE_TARGET")
            if [[ "$RELEASE_TAG" == *-* ]]; then
              release_edit_args+=(--prerelease)
            fi
            gh release edit "$RELEASE_TAG" "${release_edit_args[@]}"
            gh release upload "$RELEASE_TAG" \
              dist/netquota-windows-amd64.zip \
              dist/netquota-windows-amd64-setup.exe \
              dist/netquota-linux-amd64.tar.gz \
              dist/SHA256SUMS \
              --clobber
          else
            release_create_args=(
              --draft
              --target "$RELEASE_TARGET"
              --title "NetQuota $RELEASE_TAG"
              --generate-notes
            )
            if [[ "$RELEASE_TAG" == *-* ]]; then
              release_create_args+=(--prerelease)
            fi
            gh release create "$RELEASE_TAG" \
              dist/netquota-windows-amd64.zip \
              dist/netquota-windows-amd64-setup.exe \
              dist/netquota-linux-amd64.tar.gz \
              dist/SHA256SUMS \
              "${release_create_args[@]}"
          fi

          gh release view "$RELEASE_TAG" --json url,isDraft,isPrerelease,tagName
